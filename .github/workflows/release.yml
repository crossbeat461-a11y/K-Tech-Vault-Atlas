name: Release plugin

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Validate manifest
        run: |
          VERSION=$(jq -r .version manifest.json)
          TAG="${GITHUB_REF_NAME}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json version ($VERSION) must match git tag ($TAG)"
            exit 1
          fi
          DESC=$(jq -r .description manifest.json)
          if echo "$DESC" | grep -iq obsidian; then
            echo "manifest description must not include the word Obsidian"
            exit 1
          fi
          NAME=$(jq -r .name manifest.json)
          if echo "$NAME" | grep -iq plugin; then
            echo "manifest name must not include the word Plugin"
            exit 1
          fi
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "Missing required release file: $f"; exit 1; }
          done

      - name: Attest plugin artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: K-Tech Vault Atlas ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
